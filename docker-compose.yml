services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmpf_agent
      POSTGRES_USER: cmpf_agent
      POSTGRES_PASSWORD: cmpf_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpf_agent -d cmpf_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cmpf_agent_postgres:/var/lib/postgresql/data

volumes:
  cmpf_agent_postgres:
