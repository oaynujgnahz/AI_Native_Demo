services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cmpf_agent
      POSTGRES_USER: cmpf_agent
      POSTGRES_PASSWORD: cmpf_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpf_agent -d cmpf_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cmpf_agent_postgres:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "4318:4318"
      - "16686:16686"

volumes:
  cmpf_agent_postgres:
